<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaRise - Water Drop Rush</title>
    <link rel="stylesheet" href="styles.css">
<!-- Bootstrap LTR -->
<link id="bootstrap-ltr" rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<!-- Bootstrap RTL (disabled by default) -->
<link id="bootstrap-rtl" rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      disabled>

<!--Bootstrap Icons-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<!-- Tailwind CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <img
        src="img/cw_logo-horizontal.png"
        alt="Charity: Water logo"
        class="charity-logo"
    >
    <img
        src="img/water-can-transparent.png"
        alt="AquaRise water can logo"
        class="corner-logo"
    >
    <div class="game-wrapper">
        <h1 class="game-title">AquaRise - Water Drop Rush</h1>
        <p class="game-tagline">Catch the good drops, avoid the bad ones!</p>
        <section id="rules-section" class="rules-section" aria-live="polite"></section>

        <div class="score-panel">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="timer">Time: <span id="time">30</span>s</div>
            <button id="start-btn">Start Game</button>
            <button id="pause-btn" hidden>Pause</button>
        </div>
        
        <div id="game-container">
            <div id="pause-overlay" hidden>
                <div class="pause-panel">
                    <h2 class="pause-title">Gameplay Paused</h2>
                    <button id="resume-btn" class="pause-menu-btn">Return to Game</button>
                    <button id="restart-btn" class="pause-menu-btn">Restart Game</button>
                    <button id="end-btn" class="pause-menu-btn">End Game &amp; Reset Score</button>
                </div>
            </div>

            <div class="cloud-row" aria-hidden="true">
                <span class="cloud"></span>
                <span class="cloud"></span>
                <span class="cloud"></span>
                <span class="cloud"></span>
                <span class="cloud"></span>
                <span class="cloud"></span>
                <span class="cloud"></span>
            </div>

            <div class="grass" aria-hidden="true"></div>

            <div class="catcher" aria-hidden="true">
                <div class="bucket">
                    <span class="bucket-rim"></span>
                    <span class="bucket-handle"></span>
                </div>
                <div class="figure-head"></div>
                <div class="figure-body"></div>
                <div class="figure-arm arm-left"></div>
                <div class="figure-arm arm-right"></div>
                <div class="figure-leg leg-left"></div>
                <div class="figure-leg leg-right"></div>
            </div>

            <div class="water-meter" aria-label="Water collected">
                <span class="water-meter-label">Water<br>Collected</span>
                <div class="water-meter-track">
                    <div id="score-bar"></div>
                </div>
                <i class="bi bi-droplet-fill water-meter-icon"></i>
            </div>

        </div>

        <label class="movement-nav" for="catcher-nav">
            <span class="movement-label">Move Catcher</span>
            <input
                type="range"
                id="catcher-nav"
                min="10"
                max="90"
                value="50"
                aria-label="Move catcher left or right"
            >
        </label>
    </div>
    
    <!-- Bootstrap JS Bundle (required for dropdowns) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>


</body>
</html>
