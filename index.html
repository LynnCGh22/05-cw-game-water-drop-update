<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaRise - Water Drop Rush</title>
<!-- Bootstrap LTR -->
<link id="bootstrap-ltr" rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<!-- Bootstrap RTL (disabled by default) -->
<link id="bootstrap-rtl" rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      disabled>

<!--Bootstrap Icons-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<!-- Tailwind CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <img
        src="img/cw_logo-horizontal.png"
        alt="Charity: Water logo"
        class="charity-logo"
    >
    <img
        src="img/water-can-transparent.png"
        alt="AquaRise water can logo"
        class="corner-logo"
    >
    <div class="game-wrapper">
        <h1 class="game-title">AquaRise - Water Drop Rush</h1>
        <p class="game-tagline">Catch the good drops, avoid the bad ones!</p>
        <section id="game-background-section" class="const-game-background" aria-live="polite"></section>
        <section id="rules-section" class="rules-section" aria-live="polite"></section>

        <div class="status-stack">
            <div class="score-box">
                <div class="score">Score: <span id="score">0</span></div>
            </div>

            <section class="counter-box" aria-live="polite" aria-label="Water drop color counter">
                <h2 class="counter-title">Drop Counter</h2>
                <p id="water-drop-color-tracker" class="counter-status">No drops caught yet.</p>
                <ul class="counter-list">
                    <li>Blue Clean Drops: <span id="blue-clean-count">0</span></li>
                    <li>Green Polluted Drops: <span id="green-polluted-count">0</span></li>
                    <li>Brown Toxic Drops: <span id="brown-toxic-count">0</span></li>
                </ul>
                <p id="water-drop-type-tracker" class="counter-type" aria-live="polite"></p>
            </section>

            <div class="score-panel">
                <div class="timer">Time: <span id="time">30</span>s</div>
                <label class="audio-control" for="audio-volume" aria-label="Audio volume control">
                    <span class="audio-label">Volume</span>
                    <input
                        type="range"
                        id="audio-volume"
                        min="0"
                        max="100"
                        value="70"
                        aria-label="Set game volume"
                    >
                </label>
                <button id="mute-btn" type="button" aria-pressed="false">Mute</button>
                <button id="start-btn">Start Game</button>
                <button id="pause-btn" hidden>Pause</button>
            </div>
        </div>
        
        <div class="difficulty-bar" aria-label="Difficulty selector">
            <span class="difficulty-title">Difficulty</span>
            <div class="dropdown ms-auto">
                <button
                    id="difficulty-btn"
                    class="btn btn-outline-primary dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    aria-label="Select difficulty level"
                >
                    <span id="current-level">Easy</span>
                </button>

                <ul class="dropdown-menu dropdown-menu-end" aria-label="Difficulty level options">
                    <li><a class="dropdown-item difficulty-option" href="#" data-level="Easy">Easy</a></li>
                    <li><a class="dropdown-item difficulty-option" href="#" data-level="Medium">Medium</a></li>
                    <li><a class="dropdown-item difficulty-option" href="#" data-level="Hard">Hard</a></li>
                    <li><a class="dropdown-item difficulty-option" href="#" data-level="Expert">Expert</a></li>
                </ul>
            </div>
        </div>

        <div id="game-container">
            <div id="pause-overlay" hidden>
                <div class="pause-panel">
                    <h2 class="pause-title">Gameplay Paused</h2>
                    <button id="resume-btn" class="pause-menu-btn">Return to Game</button>
                    <button id="restart-btn" class="pause-menu-btn">Restart Game</button>
                    <button id="end-btn" class="pause-menu-btn">End Game &amp; Reset Score</button>
                </div>
            </div>

            <div class="cloud-row" aria-hidden="true">
                <span class="cloud"></span>
                <span class="cloud"></span>
                <span class="cloud"></span>
                <span class="cloud"></span>
                <span class="cloud"></span>
                <span class="cloud"></span>
                <span class="cloud"></span>
            </div>

            <div class="grass" aria-hidden="true"></div>
            <div class="brown-terrain-under-grass" aria-hidden="true"></div>

            <div class="catcher" aria-hidden="true">
                <div class="bucket">
                    <span class="bucket-rim"></span>
                    <span class="bucket-handle"></span>
                </div>
                <div class="figure-head"></div>
                <div class="figure-body"></div>
                <div class="figure-arm arm-left"></div>
                <div class="figure-arm arm-right"></div>
                <div class="figure-leg leg-left"></div>
                <div class="figure-leg leg-right"></div>
            </div>

            <div class="water-meter" aria-label="Water collected">
                <span class="water-meter-label">Water<br>Collected</span>
                <div class="water-meter-track">
                    <div id="score-bar"></div>
                </div>
                <i class="bi bi-droplet-fill water-meter-icon"></i>
            </div>

        </div>

        <label class="movement-nav" for="catcher-nav">
            <span class="movement-label">Move Catcher</span>
            <input
                type="range"
                id="catcher-nav"
                min="10"
                max="90"
                value="50"
                aria-label="Move catcher left or right"
            >
        </label>
    </div>
    
    <!-- Audio elements for background music and sound effects -->
    <audio id="background-music" loop>
        <source src="audio/joyinsound-corporate-upbeat-motivational-music-royalty-free-496474.mp3" type="audio/mpeg">
    </audio>
    <audio id="wind-sound" loop>
        <source src="audio/bbc_wind---blu_nhu0503906.mp3" type="audio/mpeg">
    </audio>
    <audio id="winner-sound">
        <source src="audio/superpuyofans1234-winner-game-sound-404167%20%281%29.mp3" type="audio/mpeg">
    </audio>

    <!-- Bootstrap JS Bundle (required for dropdowns) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>


</body>
</html>
